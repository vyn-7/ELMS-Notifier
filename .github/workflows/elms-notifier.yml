name: ELMS assignment notifier

on:
  schedule:
    # 10:00, 18:00, and 22:00 Asia/Manila (UTC+8). GitHub cron is UTC.
    - cron: "0 2,10,14 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: elms-notifier
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Install dependencies
        run: pip install -r requirements-cloud.txt

      - name: Restore state
        uses: actions/cache/restore@v6
        with:
          path: state.json
          key: elms-state-${{ github.run_id }}
          restore-keys: elms-state-

      - name: Run notifier
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          ELMS_COOKIES_JSON: ${{ secrets.ELMS_COOKIES }}
        run: python src/main.py

      - name: Save state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v6
        with:
          path: state.json
          key: elms-state-${{ github.run_id }}
