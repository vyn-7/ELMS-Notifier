name: ELMS assignment notifier

on:
  schedule:
    # 10:31, 13:31, and 22:31 Asia/Manila (UTC+8). GitHub cron is UTC.
    - cron: "31 2,5,14 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: elms-notifier
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore state
        uses: actions/cache/restore@v6
        with:
          path: state.json
          key: elms-state-${{ github.run_id }}
          restore-keys: elms-state-

      - name: Refresh ELMS session
        continue-on-error: true
        env:
          ELMS_SSO_COOKIES_JSON: ${{ secrets.ELMS_SSO_COOKIES }}
        run: python scripts/refresh_session.py --headless --no-secret --timeout 45

      - name: Run notifier
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          ELMS_COOKIES_JSON: ${{ secrets.ELMS_COOKIES }}
        run: |
          if [ -s .session/cookies.json ]; then
            export ELMS_COOKIES_JSON="$(cat .session/cookies.json)"
          fi
          python src/main.py

      - name: Save state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v6
        with:
          path: state.json
          key: elms-state-${{ github.run_id }}